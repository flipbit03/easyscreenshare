# Publishing a GitHub Release (tag vX.Y.Z) builds the Windows portable .exe
# and the Linux AppImage and attaches both to that release. The version is
# STAMPED from the tag at build time — the repo keeps 0.0.0 forever, so no
# version-bump commits.
#   Cut one with:  gh release create v0.3.2 --generate-notes
name: Release Desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v (e.g. 0.3.2). Builds artifacts only; does not attach to a release."
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            make: make:win
            glob: "*.exe"
          - os: ubuntu-latest
            platform: linux
            make: make:linux
            glob: "*.AppImage"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # dangerouslyAllowAllBuilds: run every postinstall so pnpm's build gate
      # (ERR_PNPM_IGNORED_BUILDS) can't fail the frozen install on a fresh
      # runner. Safe here — the lockfile is committed and supply-chain-verified.
      - run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            V="${{ github.event.release.tag_name }}"
          else
            V="v${{ github.event.inputs.version }}"
          fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "num=${V#v}" >> "$GITHUB_OUTPUT"
          echo "Building version ${V#v}"

      - name: Stamp version into desktop package.json (not committed)
        shell: bash
        run: |
          node -e "const f='packages/desktop/package.json';const fs=require('fs');const p=JSON.parse(fs.readFileSync(f));p.version='${{ steps.ver.outputs.num }}';fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - run: pnpm --filter @easyscreenshare/core build

      - run: pnpm --filter @easyscreenshare/desktop run ${{ matrix.make }}

      - name: Checksums
        shell: bash
        run: |
          cd packages/desktop/out/portable
          sha256sum ${{ matrix.glob }} > SHA256SUMS-${{ matrix.platform }}.txt
          cat SHA256SUMS-${{ matrix.platform }}.txt

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" \
            packages/desktop/out/portable/${{ matrix.glob }} \
            packages/desktop/out/portable/SHA256SUMS-${{ matrix.platform }}.txt \
            --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: easyscreenshare-${{ matrix.platform }}-${{ steps.ver.outputs.num }}
          path: |
            packages/desktop/out/portable/${{ matrix.glob }}
            packages/desktop/out/portable/SHA256SUMS-${{ matrix.platform }}.txt
