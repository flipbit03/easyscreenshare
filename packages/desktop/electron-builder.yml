# Wraps the Forge-packaged win32 output into ONE portable .exe (no installer).
# Used with --prepackaged, so Forge remains the packager; this only makes the
# single-file artifact. signAndEditExecutable=false keeps the build wine-free
# on Linux/WSL (stock Electron icon/metadata until CI builds on Windows).
appId: com.flipbit03.easyscreenshare
productName: easyscreenshare
directories:
  output: out/portable
win:
  target: portable
  signAndEditExecutable: false
portable:
  artifactName: easyscreenshare-${version}-portable.exe
linux:
  target: AppImage
  category: Network
  # Must match the Forge-packaged binary; the default derives from the scoped
  # package name (@easyscreenshare/desktop) and is invalid in file paths.
  executableName: easyscreenshare
appImage:
  artifactName: easyscreenshare-${version}-x86_64.AppImage
